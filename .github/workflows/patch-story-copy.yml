name: Patch GTA VI story copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-story-copy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update story text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          text = text.replace('            <span>Rockstar has not fully defined what they are to each other — only that their futures become tightly connected.</span>\n', '')
          text = text.replace('          <p>Lucia has been held in Leonida Penitentiary after fighting for her family. Rockstar says luck helped her get out, and she is determined to make smarter moves from here.</p>', '          <p>Lucia has been held in Leonida Penitentiary after fighting for her family. She is determined to make smarter moves from here.</p>')
          p.write_text(text)
          PY

      - name: Commit changes
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Tighten Jason and Lucia story copy'
          git push
