name: Patch homepage requested updates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-newsletter-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply requested homepage updates
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text()

          replacements = [
              (
                  '<a class="btn primary" href="#story">Explore GTA VI</a>',
                  '<button class="btn primary" type="button" data-open-newsletter>Subscribe for GTA VI Updates</button>'
              ),
              (
                  '<p>Jason and Lucia know the odds are stacked against them. After an easy score goes wrong, they are pulled into a criminal conspiracy stretching across Leonida and have to depend on each other to survive.</p>',
                  '''<p class="story-pitch">\n            <span>Leonida looks like paradise, but Jason and Lucia are headed straight for its darkest side.</span>\n            <span>Jason wants an easier life; Lucia is fresh out of prison and determined to change her odds.</span>\n            <span>Then an easy score goes wrong.</span>\n            <span>What should have been quick money pulls them into a criminal conspiracy stretching across the state.</span>\n            <span>Rockstar has not fully defined what they are to each other — only that their futures become tightly connected.</span>\n            <span>With the pressure closing in, surviving Leonida means relying on each other more than ever.</span>\n          </p>'''
              ),
              (
                  '<div class="media-note glass"><b>Also tracked:</b> Rockstar’s official media page currently lists 9 short clips, including character clips for Jason, Lucia, Cal, Boobie Ike, Dre’Quan, Real Dimez, Raul, and Brian, plus the cover-art animation.</div>',
                  '<!-- Also tracked: Rockstar’s official media page currently lists 9 short clips, including character clips for Jason, Lucia, Cal, Boobie Ike, Dre’Quan, Real Dimez, Raul, and Brian, plus the cover-art animation. -->'
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected index.html text not found: {old[:80]}')
              text = text.replace(old, new, 1)

          index.write_text(text)

          styles = Path('styles.css')
          css = styles.read_text()
          marker = '/* Requested homepage copy + speculation navigation refinements */'
          if marker not in css:
              css += '''\n\n/* Requested homepage copy + speculation navigation refinements */\n.story-pitch{display:grid;gap:10px}\n.story-pitch span{display:block}\n.main-nav .speculation-nav-link{color:var(--pink);text-shadow:0 0 18px rgba(255,76,166,.28)}\n.main-nav .speculation-nav-link:hover{color:var(--orange);text-shadow:0 0 22px rgba(255,155,84,.42)}\n'''
          styles.write_text(css)
          PY

      - name: Commit requested site updates
        run: |
          if git diff --quiet -- index.html styles.css; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html styles.css
          git commit -m 'Refine homepage story and navigation'
          git push
